<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Item Audit — FindLoop</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background-color: var(--bg-navy-dark); color: white;">
  <div class="app-layout app-layout-dark">
    <aside class="sidebar">
      <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-dark);">
        <a href="index.html" class="brand-logo" style="color: white;">
          <div class="brand-icon" style="background-color: var(--accent-gold); color: #0F172A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 22V12a6 6 0 1 1 12 0v10"></path></svg></div>
          <div class="brand-text">Find<span style="color:var(--accent-gold);">Loop</span><span class="brand-sub" style="color:var(--accent-gold);">Campus Admin</span></div>
        </a>
      </div>
      <nav style="flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 0.25rem;">
        <a href="index.html" class="btn btn-navy" style="justify-content: flex-start;">📊 Overview</a>
        <a href="items.html" class="btn btn-amber" style="justify-content: flex-start;">📦 Items Registry</a>
        <a href="reports.html" class="btn btn-navy" style="justify-content: flex-start;">📩 Found Reports</a>
        <a href="users.html" class="btn btn-navy" style="justify-content: flex-start;">👥 User Directory</a>
        <a href="analytics.html" class="btn btn-navy" style="justify-content: flex-start;">📈 Analytics</a>
        <a href="settings.html" class="btn btn-navy" style="justify-content: flex-start;">⚙️ Settings</a>
      </nav>
    </aside>

    <div class="main-content">
      <div class="top-bar top-bar-dark">
        <h1 style="font-size: 1.25rem; font-weight: 900; color: white;" id="audit-title">Item Audit View</h1>
      </div>

      <main class="content-body" style="max-width: 680px; display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="card-dark" style="display: flex; flex-direction: column; gap: 1rem;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 1.5rem; font-weight: 900;" id="audit-name">Item Name</h2>
            <span class="badge badge-found" id="audit-status">LOST</span>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.8rem; font-family: var(--font-mono);">
            <div style="background:#0B1120; padding: 0.75rem; border-radius: 8px;"><span style="color:#64748B;">Item Code:</span> <strong id="audit-code" style="color:var(--accent-gold);">FL-XXXXX</strong></div>
            <div style="background:#0B1120; padding: 0.75rem; border-radius: 8px;"><span style="color:#64748B;">QR Token:</span> <strong id="audit-token" style="color:white;">tok_xxxx</strong></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from "../js/auth.js";
    import { getItemByIdOrToken } from "../js/firestore.js";
    import { getQueryParam } from "../js/utils.js";

    requireAdmin();
    const itemId = getQueryParam("id");

    async function loadAudit() {
      const item = await getItemByIdOrToken(itemId);
      if (item) {
        document.getElementById("audit-title").textContent = `Audit #${item.itemCode}`;
        document.getElementById("audit-name").textContent = item.itemName;
        document.getElementById("audit-code").textContent = item.itemCode;
        document.getElementById("audit-token").textContent = item.qrToken;
        document.getElementById("audit-status").textContent = item.status;
      }
    }

    loadAudit();
  </script>
</body>
</html>
