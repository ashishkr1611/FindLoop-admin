<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Found Reports Registry — Campus Admin</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background-color: var(--bg-navy-dark); color: white;">
  <div class="app-layout app-layout-dark">
    <aside class="sidebar">
      <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-dark);">
        <a href="index.html" class="brand-logo" style="color: white;">
          <div class="brand-icon" style="background-color: var(--accent-gold); color: #0F172A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 22V12a6 6 0 1 1 12 0v10"></path></svg></div>
          <div class="brand-text">Find<span style="color:var(--accent-gold);">Loop</span><span class="brand-sub" style="color:var(--accent-gold);">Campus Admin</span></div>
        </a>
      </div>
      <nav style="flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 0.25rem;">
        <a href="index.html" class="btn btn-navy" style="justify-content: flex-start;">📊 Overview</a>
        <a href="items.html" class="btn btn-navy" style="justify-content: flex-start;">📦 Items Registry</a>
        <a href="reports.html" class="btn btn-amber" style="justify-content: flex-start;">📩 Found Reports</a>
        <a href="users.html" class="btn btn-navy" style="justify-content: flex-start;">👥 User Directory</a>
        <a href="analytics.html" class="btn btn-navy" style="justify-content: flex-start;">📈 Analytics</a>
        <a href="settings.html" class="btn btn-navy" style="justify-content: flex-start;">⚙️ Settings</a>
      </nav>
    </aside>

    <div class="main-content">
      <div class="top-bar top-bar-dark">
        <h1 style="font-size: 1.25rem; font-weight: 900; color: white;">Global Found Reports</h1>
      </div>

      <main class="content-body" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="card-dark" style="display: flex; flex-direction: column; gap: 1rem;">
          <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem;">
              <thead>
                <tr style="border-bottom: 1px solid #334155; font-family: var(--font-mono); font-size: 0.7rem; color: #94A3B8; text-transform: uppercase;">
                  <th style="padding: 0.75rem;">Report ID</th>
                  <th style="padding: 0.75rem;">Found Spot</th>
                  <th style="padding: 0.75rem;">Handover Desk</th>
                  <th style="padding: 0.75rem;">Status</th>
                  <th style="padding: 0.75rem; text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody id="reports-table-body">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from "../js/auth.js";
    import { getAllReportsAdmin } from "../js/firestore.js";

    requireAdmin();

    async function loadReports() {
      const reports = await getAllReportsAdmin();
      const tbody = document.getElementById("reports-table-body");
      tbody.innerHTML = "";

      reports.forEach(r => {
        const tr = document.createElement("tr");
        tr.style.borderBottom = "1px solid #334155";
        tr.innerHTML = `
          <td style="padding: 0.75rem; font-family: var(--font-mono); font-weight: 700; color: var(--accent-gold);">${r.reportId}</td>
          <td style="padding: 0.75rem; color: white;">${r.location} (${r.specificLocation})</td>
          <td style="padding: 0.75rem; color: var(--teal-light); font-weight: 700;">${r.handoverLocation}</td>
          <td style="padding: 0.75rem;"><span class="badge" style="background:#334155; color:white;">${r.status}</span></td>
          <td style="padding: 0.75rem; text-align: right;"><a href="report-details.html?id=${r.reportId}" class="btn btn-amber" style="padding: 0.25rem 0.625rem; font-size: 0.7rem;">Review</a></td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadReports();
  </script>
</body>
</html>
