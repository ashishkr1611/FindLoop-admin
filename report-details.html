<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Report Moderation — FindLoop</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color: var(--bg-navy-dark); color: white;">
  <div class="app-layout app-layout-dark">
    <aside class="sidebar">
      <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-dark);">
        <a href="index.html" class="brand-logo" style="color: white;">
          <div class="brand-icon" style="background-color: var(--accent-gold); color: #0F172A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 22V12a6 6 0 1 1 12 0v10"></path></svg></div>
          <div class="brand-text">Find<span style="color:var(--accent-gold);">Loop</span><span class="brand-sub" style="color:var(--accent-gold);">Campus Admin</span></div>
        </a>
      </div>
      <nav style="flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 0.25rem;">
        <a href="index.html" class="btn btn-navy" style="justify-content: flex-start;">📊 Overview</a>
        <a href="items.html" class="btn btn-navy" style="justify-content: flex-start;">📦 Items Registry</a>
        <a href="reports.html" class="btn btn-amber" style="justify-content: flex-start;">📩 Found Reports</a>
        <a href="users.html" class="btn btn-navy" style="justify-content: flex-start;">👥 User Directory</a>
        <a href="analytics.html" class="btn btn-navy" style="justify-content: flex-start;">📈 Analytics</a>
        <a href="settings.html" class="btn btn-navy" style="justify-content: flex-start;">⚙️ Settings</a>
      </nav>
    </aside>

    <div class="main-content">
      <div class="top-bar top-bar-dark">
        <h1 style="font-size: 1.25rem; font-weight: 900; color: white;" id="mod-title">Report Moderation View</h1>
      </div>

      <main class="content-body" style="max-width: 680px; display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="card-dark" style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 1.5rem; font-weight: 900;" id="mod-location">Library</h2>
            <span class="badge badge-found" id="mod-status">HANDOVER</span>
          </div>

          <div style="background:#0B1120; border:1px solid #334155; padding: 1rem; border-radius: 12px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 0.5rem;">
            <div><span style="color:#94A3B8;">Handover Point:</span> <strong id="mod-handover" style="color:var(--teal-light);">Security Desk</strong></div>
            <div><span style="color:#94A3B8;">Verification Code:</span> <strong id="mod-code" style="font-family:var(--font-mono); color:var(--accent-gold);">482910</strong></div>
            <div><span style="color:#94A3B8;">Message:</span> <span id="mod-msg" style="font-style:italic;">"Found near study tables."</span></div>
          </div>

          <div style="border-top: 1px solid #334155; padding-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem;">
            <button id="btn-mark-reviewed" class="btn btn-outline" style="font-size: 0.75rem;">Mark Reviewed</button>
            <button id="btn-handover-ready" class="btn btn-amber" style="font-size: 0.75rem;">Set Handover Ready</button>
            <button id="btn-block-report" class="btn btn-rose" style="font-size: 0.75rem;">Block Report</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from "./js/auth.js";
    import { getAllReportsAdmin, updateReportStatusInFirestore } from "./js/firestore.js";
    import { getQueryParam, showToast } from "./js/utils.js";

    requireAdmin();
    const reportId = getQueryParam("id");
    let currentReport = null;

    async function loadMod() {
      const reports = await getAllReportsAdmin();
      currentReport = reports.find(r => r.reportId === reportId) || reports[0];

      if (currentReport) {
        document.getElementById("mod-title").textContent = `Report #${currentReport.reportId} Moderation`;
        document.getElementById("mod-location").textContent = `${currentReport.location} (${currentReport.specificLocation || 'General area'})`;
        document.getElementById("mod-status").textContent = currentReport.status;
        document.getElementById("mod-handover").textContent = currentReport.handoverLocation;
        document.getElementById("mod-code").textContent = currentReport.verificationCode;
        document.getElementById("mod-msg").textContent = `"${currentReport.message || 'None'}"`;
      }
    }

    document.getElementById("btn-mark-reviewed").addEventListener("click", async () => {
      const id = currentReport ? currentReport.reportId : (reportId || "rep_calc_101");
      await updateReportStatusInFirestore(id, "REVIEWED");
      const badge = document.getElementById("mod-status");
      if (badge) {
        badge.textContent = "REVIEWED";
        badge.className = "badge badge-safe";
      }
      showToast("Report marked as REVIEWED!");
    });

    document.getElementById("btn-handover-ready").addEventListener("click", async () => {
      const id = currentReport ? currentReport.reportId : (reportId || "rep_calc_101");
      await updateReportStatusInFirestore(id, "HANDOVER_READY");
      const badge = document.getElementById("mod-status");
      if (badge) {
        badge.textContent = "HANDOVER READY";
        badge.className = "badge badge-found";
      }
      showToast("Report set to HANDOVER READY!");
    });

    document.getElementById("btn-block-report").addEventListener("click", async () => {
      const id = currentReport ? currentReport.reportId : (reportId || "rep_calc_101");
      await updateReportStatusInFirestore(id, "BLOCKED");
      const badge = document.getElementById("mod-status");
      if (badge) {
        badge.textContent = "BLOCKED";
        badge.className = "badge badge-lost";
      }
      showToast("Report BLOCKED due to moderation flag.", "error");
    });

    loadMod();
  </script>
</body>
</html>
