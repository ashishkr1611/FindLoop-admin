            <thead>
              <tr style="border-bottom: 1px solid #334155; font-family: var(--font-mono); font-size: 0.7rem; color: #94A3B8; text-transform: uppercase;">

            <tbody>
              <tr style="border-bottom: 1px solid #334155;">
                <td style="padding: 0.75rem; font-weight: 700;">Anshu Bala</td>
                <td style="padding: 0.75rem; font-family: var(--font-mono);">anshubala@gehu.ac.in</td>
                <td style="padding: 0.75rem; font-family: var(--font-mono); color: var(--accent-gold);">260122209</td>

              </tr>

          </table>
        </div>
