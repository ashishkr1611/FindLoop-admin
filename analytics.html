<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Analytics — FindLoop</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color: var(--bg-navy-dark); color: white;">
  <div class="app-layout app-layout-dark">
    <aside class="sidebar">
      <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-dark);">
        <a href="index.html" class="brand-logo" style="color: white;">
          <div class="brand-icon" style="background-color: var(--accent-gold); color: #0F172A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 22V12a6 6 0 1 1 12 0v10"></path></svg></div>
          <div class="brand-text">Find<span style="color:var(--accent-gold);">Loop</span><span class="brand-sub" style="color:var(--accent-gold);">Campus Admin</span></div>
        </a>
      </div>
      <nav style="flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 0.25rem;">
        <a href="index.html" class="btn btn-navy" style="justify-content: flex-start;">📊 Overview</a>
        <a href="items.html" class="btn btn-navy" style="justify-content: flex-start;">📦 Items Registry</a>
        <a href="reports.html" class="btn btn-navy" style="justify-content: flex-start;">📩 Found Reports</a>
        <a href="users.html" class="btn btn-navy" style="justify-content: flex-start;">👥 User Directory</a>
        <a href="analytics.html" class="btn btn-amber" style="justify-content: flex-start;">📈 Analytics</a>
        <a href="settings.html" class="btn btn-navy" style="justify-content: flex-start;">⚙️ Settings</a>
      </nav>
    </aside>

    <div class="main-content">
      <div class="top-bar top-bar-dark">
        <h1 style="font-size: 1.25rem; font-weight: 900; color: white;">Campus Recovery Analytics</h1>
      </div>

      <main class="content-body" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="grid-2">
          <!-- Category Breakdown -->
          <div class="card-dark" style="display: flex; flex-direction: column; gap: 1rem;">
            <h3 style="font-size: 1rem; font-weight: 800;">Most Common Lost Categories</h3>
            <div id="category-analytics-container" style="display: flex; flex-direction: column; gap: 0.75rem; font-size: 0.8rem;">
              <p style="color: #94A3B8;">Loading category analytics...</p>
            </div>
          </div>

          <!-- Hotspots -->
          <div class="card-dark" style="display: flex; flex-direction: column; gap: 1rem;">
            <h3 style="font-size: 1rem; font-weight: 800;">Top Found Item Hotspots</h3>
            <div id="hotspot-analytics-container" style="display: flex; flex-direction: column; gap: 0.75rem; font-size: 0.8rem;">
              <p style="color: #94A3B8;">Loading location hotspots...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from "./js/auth.js";
    import { getAllItemsAdmin, getAllReportsAdmin } from "./js/firestore.js";

    requireAdmin();

    async function renderAnalytics() {
      const items = await getAllItemsAdmin();
      const reports = await getAllReportsAdmin();

      // 1. Categories
      const catContainer = document.getElementById("category-analytics-container");
      catContainer.innerHTML = "";

      if (!items || items.length === 0) {
        catContainer.innerHTML = `<p style="color: #94A3B8; font-style: italic;">No items registered in database yet.</p>`;
      } else {
        const catCounts = {};
        items.forEach(i => {
          const cat = i.category || "General";
          catCounts[cat] = (catCounts[cat] || 0) + 1;
        });

        const sortedCats = Object.entries(catCounts).sort((a, b) => b[1] - a[1]);
        const colors = ["var(--teal-light)", "#38BDF8", "var(--accent-gold)", "#A855F7", "#EC4899"];

        sortedCats.forEach(([catName, count], idx) => {
          const pct = Math.round((count / items.length) * 100);
          const color = colors[idx % colors.length];

          const row = document.createElement("div");
          row.innerHTML = `
            <div style="display: flex; justify-content: space-between; margin-bottom: 3px;">
              <span style="font-weight: 700;">${catName}</span>
              <span style="color: #94A3B8; font-family: var(--font-mono);">${pct}% (${count} ${count === 1 ? 'item' : 'items'})</span>
            </div>
            <div style="background:#0B1120; height: 8px; border-radius: 4px; overflow: hidden;">
              <div style="width: ${pct}%; height: 100%; background: ${color}; border-radius: 4px; transition: width 0.6s ease;"></div>
            </div>
          `;
          catContainer.appendChild(row);
        });
      }

      // 2. Hotspots
      const spotContainer = document.getElementById("hotspot-analytics-container");
      spotContainer.innerHTML = "";

      if (!reports || reports.length === 0) {
        spotContainer.innerHTML = `<p style="color: #94A3B8; font-style: italic;">No found reports submitted yet.</p>`;
      } else {
        const spotCounts = {};
        reports.forEach(r => {
          const loc = r.location || "General Campus";
          spotCounts[loc] = (spotCounts[loc] || 0) + 1;
        });

        const sortedSpots = Object.entries(spotCounts).sort((a, b) => b[1] - a[1]);
        
        sortedSpots.forEach(([locName, count]) => {
          const pct = Math.round((count / reports.length) * 100);

          const row = document.createElement("div");
          row.innerHTML = `
            <div style="display: flex; justify-content: space-between; margin-bottom: 3px;">
              <span style="font-weight: 700;">${locName}</span>
              <span style="color: #94A3B8; font-family: var(--font-mono);">${pct}% (${count} ${count === 1 ? 'report' : 'reports'})</span>
            </div>
            <div style="background:#0B1120; height: 8px; border-radius: 4px; overflow: hidden;">
              <div style="width: ${pct}%; height: 100%; background: var(--accent-gold); border-radius: 4px; transition: width 0.6s ease;"></div>
            </div>
          `;
          spotContainer.appendChild(row);
        });
      }
    }

    renderAnalytics();
  </script>
</body>
</html>
