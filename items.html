<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Items Registry — Campus Admin</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color: var(--bg-navy-dark); color: white;">
  <div class="app-layout app-layout-dark">
    <aside class="sidebar">
      <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-dark);">
        <a href="index.html" class="brand-logo" style="color: white;">
          <div class="brand-icon" style="background-color: var(--accent-gold); color: #0F172A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 22V12a6 6 0 1 1 12 0v10"></path></svg></div>
          <div class="brand-text"><span class="brand-name">Find<span style="color:var(--accent-gold);">Loop</span></span><span class="brand-sub" style="color:var(--accent-gold);">Campus Admin</span></div>
        </a>
      </div>
      <nav style="flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 0.25rem;">
        <a href="index.html" class="btn btn-navy" style="justify-content: flex-start;">📊 Overview</a>
        <a href="items.html" class="btn btn-amber" style="justify-content: flex-start;">📦 Items Registry</a>
        <a href="reports.html" class="btn btn-navy" style="justify-content: flex-start;">📩 Found Reports</a>
        <a href="users.html" class="btn btn-navy" style="justify-content: flex-start;">👥 User Directory</a>
        <a href="analytics.html" class="btn btn-navy" style="justify-content: flex-start;">📈 Analytics</a>
        <a href="settings.html" class="btn btn-navy" style="justify-content: flex-start;">⚙️ Settings</a>
      </nav>
    </aside>

    <div class="main-content">
      <div class="top-bar top-bar-dark">
        <h1 style="font-size: 1.25rem; font-weight: 900; color: white;">Global Items Registry</h1>
      </div>

      <main class="content-body" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="card-dark" style="display: flex; flex-direction: column; gap: 1rem;">
          <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem;">
              <thead>
                <tr style="border-bottom: 1px solid #334155; font-family: var(--font-mono); font-size: 0.7rem; color: #94A3B8; text-transform: uppercase;">
                  <th style="padding: 0.75rem;">Tag ID</th>
                  <th style="padding: 0.75rem;">Item Name</th>
                  <th style="padding: 0.75rem;">Category</th>
                  <th style="padding: 0.75rem;">Status</th>
                  <th style="padding: 0.75rem;">QR Active</th>
                  <th style="padding: 0.75rem; text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody id="items-registry-table">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from "./js/auth.js";
    import { getAllItemsAdmin } from "./js/firestore.js";

    requireAdmin();

    async function loadItemsRegistry() {
      const items = await getAllItemsAdmin();
      const tbody = document.getElementById("items-registry-table");
      tbody.innerHTML = "";

      items.forEach(item => {
        const tr = document.createElement("tr");
        tr.style.borderBottom = "1px solid #334155";
        tr.innerHTML = `
          <td style="padding: 0.75rem; font-family: var(--font-mono); font-weight: 700; color: var(--accent-gold);">${item.itemCode}</td>
          <td style="padding: 0.75rem; font-weight: 700; color: white;">${item.itemName}</td>
          <td style="padding: 0.75rem; color: #CBD5E1;">${item.category} (${item.color})</td>
          <td style="padding: 0.75rem;"><span class="badge" style="background:#334155; color:white;">${item.status}</span></td>
          <td style="padding: 0.75rem; font-weight: 700; color: ${item.qrActive ? '#10B981' : '#E11D48'};">${item.qrActive ? 'ACTIVE' : 'DISABLED'}</td>
          <td style="padding: 0.75rem; text-align: right;"><a href="item-details.html?id=${item.itemId}" class="btn btn-navy" style="padding: 0.25rem 0.625rem; font-size: 0.7rem;">View Audit</a></td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadItemsRegistry();
  </script>
</body>
</html>
